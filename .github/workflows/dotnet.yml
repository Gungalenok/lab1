name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Program
      run: |
        cp commands.txt "bin/Release/net10.0/" || true
        cp sequences.txt "bin/Release/net10.0/" || true
        dotnet run --no-build --configuration Release

    - name: Check result file
      run: |
        if [ -f "bin/Release/net10.0/genedata.txt" ]; then
          echo "✅ genedata.txt создан"
          head -n 15 "bin/Release/net10.0/genedata.txt"
        else
          echo "❌ genedata.txt НЕ создан"
          exit 1
        fi

    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: genedata-result
        path: bin/Release/net10.0/genedata.txt