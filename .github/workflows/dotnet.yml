name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build and run tests
      run: dotnet test tests/lab1.Tests/lab1.Tests.csproj --configuration Release

    - name: Run Program
      run: |
        dotnet run --project lab1.csproj --no-build --configuration Release

    - name: Check result file
      run: |
        if [ -f "bin/Release/net10.0/genedata.txt" ]; then
          echo "✅ genedata.txt создан"
          head -n 15 "bin/Release/net10.0/genedata.txt"
        else
          echo "❌ genedata.txt НЕ создан"
          exit 1
        fi

    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: genedata-result
        path: bin/Release/net10.0/genedata.txt
